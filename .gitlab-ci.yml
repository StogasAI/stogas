# GitLab's hosted runners rebuild each release and sign a build proof for every release file: a
# second proof beside GitHub's, from a builder that neither GitHub nor Stogas runs. Stogas pushes
# the release tag to gitlab.com/stogasai/stogas, uploads the Apple compiler outputs of GitHub's
# build, which only Apple hardware builds, and starts this pipeline. The release is published only
# when this build's files equal GitHub's byte for byte.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

rebuild:
  # release/gitlab.sh starts its own Docker daemon instead of a GitLab service, so the daemon
  # also runs with only the variables named below.
  image:
    name: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    entrypoint: ['']
  # 4 CPUs and 16 GB on every GitLab tier.
  tags: [saas-linux-medium-amd64]
  # The ID token expires with the job's timeout, so cosign can still sign after the build.
  timeout: 3h
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    GIT_DEPTH: '1'
  script:
    # GitLab adds the project's and the pipeline's CI/CD variables to every job, where they could
    # change the build without a change to this file, so the rebuild gets only these.
    - >-
      env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root
      CI_API_V4_URL="$CI_API_V4_URL" CI_COMMIT_SHA="$CI_COMMIT_SHA" CI_COMMIT_TAG="$CI_COMMIT_TAG"
      CI_JOB_STARTED_AT="$CI_JOB_STARTED_AT" CI_JOB_TOKEN="$CI_JOB_TOKEN" CI_JOB_URL="$CI_JOB_URL"
      CI_PROJECT_ID="$CI_PROJECT_ID" CI_PROJECT_URL="$CI_PROJECT_URL"
      CI_RUNNER_DESCRIPTION="$CI_RUNNER_DESCRIPTION" CI_RUNNER_ID="$CI_RUNNER_ID"
      SIGSTORE_ID_TOKEN="$SIGSTORE_ID_TOKEN" sh -eu release/gitlab.sh
  artifacts:
    paths: [gitlab-attestation.jsonl]
    expire_in: 90 days
