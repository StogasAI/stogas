project:
  name: stogas
  description: Verified confidential HTTP transport backed by Rust.
  links:
    homepage: https://stogas.ai
  authors: [Stogas]
  license: Apache-2.0
  languages:
    java:
      groupId: ai.stogas
      artifactId: stogas

release:
  github:
    owner: StogasAI
    name: stogas
    skipRelease: true

signing:
  active: ALWAYS
  pgp:
    active: ALWAYS
    armored: true
    mode: MEMORY

deploy:
  maven:
    mavenCentral:
      central:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories: [release-staging/maven]
        # The POM check builds a Maven project, and plain Maven does not know
        # Android's aar packaging. Central still checks the POM's required fields.
        artifactOverrides:
          - groupId: ai.stogas
            artifactId: stogas-android
            verifyPom: false
