[package]
name = "stogas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22.1"
serde_json = "1"
libfuzzer-sys = "0.4.13"
# The most used Rust SEV-SNP crate, against whose report parser the sev_snp target compares.
sev = { version = "=9.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
sha2 = "0.11.1"
stogas-sev-snp = { path = "../crates/sev-snp", features = ["serde"] }
stogas-sigstore = { path = "../crates/sigstore" }
stogas-core = { path = "../crates/core", features = ["staging"] }
stogas-ffi = { path = "../crates/ffi", features = ["gateway"] }

[[bin]]
name = "sigstore"
path = "fuzz_targets/sigstore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "current_evidence"
path = "fuzz_targets/current_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_evidence"
path = "fuzz_targets/session_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_abi"
path = "fuzz_targets/c_abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_setup"
path = "fuzz_targets/encrypted_setup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sev_snp"
path = "fuzz_targets/sev_snp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signatures"
path = "fuzz_targets/signatures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ratchet"
path = "fuzz_targets/ratchet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipts"
path = "fuzz_targets/receipts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_proofs"
path = "fuzz_targets/log_proofs.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
