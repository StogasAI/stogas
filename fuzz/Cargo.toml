[package]
name = "stogas-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22.1"
serde_json = "1"
libfuzzer-sys = "0.4.13"
sha2 = "0.10.9"
stogas-sigstore = { path = "../crates/sigstore" }
stogas-core = { path = "../crates/core", features = ["staging"] }
stogas-ffi = { path = "../crates/ffi", features = ["gateway"] }

[[bin]]
name = "sigstore"
path = "fuzz_targets/sigstore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "current_evidence"
path = "fuzz_targets/current_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_evidence"
path = "fuzz_targets/session_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_abi"
path = "fuzz_targets/c_abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_setup"
path = "fuzz_targets/encrypted_setup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signatures"
path = "fuzz_targets/signatures.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ratchet"
path = "fuzz_targets/ratchet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
