[package]
name = "stogas-python"
description = "Python bindings for the Stogas SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_stogas"
crate-type = ["cdylib"]

[features]
staging = ["stogas-core/staging", "stogas-sdk/staging"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310", "extension-module", "generate-import-lib"] }
serde_json.workspace = true
serde.workspace = true
stogas-core = { path = "../../crates/core" }
stogas-sdk = { package = "stogas", path = "../../crates/sdk" }

[lints]
workspace = true
