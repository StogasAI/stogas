name: Build SDK release proposal

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: targets
        run: |
          python3 scripts/check-package-versions.py "${GITHUB_REF_NAME#v}"
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', os.environ['GITHUB_REF_NAME']):
              raise SystemExit('Invalid release tag')
          targets = json.loads(Path('release/targets.json').read_text())['targets']
          matrix = {'include': [
              {'platform': name, 'runner': 'ubuntu-24.04', 'triple': target['triple']}
              for name, target in targets.items() if target['os'] not in ('macos', 'ios')
          ] + [
              {'platform': 'apple', 'runner': 'macos-15-intel', 'triple': ','.join(target['triple'] for target in targets.values() if target['os'] in ('macos', 'ios'))},
              {'platform': 'portable', 'runner': 'ubuntu-24.04', 'triple': 'wasm32-unknown-unknown'}
          ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY

  build:
    name: Build ${{ matrix.platform }}
    needs: [metadata, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.triple }}
          components: llvm-tools-preview
      - if: runner.os == 'macOS'
        name: Select the reviewed Apple toolchain
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          python3 -m pip install --require-hashes --only-binary=:all: -r release/apple-requirements.txt
      - name: Build production packages from an immutable source snapshot
        run: python3 -B release/release.py build --platform "$PLATFORM" --out "$RUNNER_TEMP/sdk-build"
      - name: Preserve build and source permissions for collection
        run: |
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'release')
          from artifacts import tar_gz
          root = Path(os.environ['RUNNER_TEMP'])
          epoch = json.loads((root / 'sdk-build/build.json').read_text())['source']['epoch']
          tar_gz(root / (os.environ['PLATFORM'] + '.tar.gz'), root / 'sdk-build', epoch)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-build-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  proposal:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sdk-build-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Collect all platforms and assemble release packages
        run: |
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'release')
          from artifacts import unpack
          from release import collect
          root = Path(os.environ['RUNNER_TEMP'])
          builds = []
          for archive in sorted((root / 'shards').glob('*.tar.gz')):
              destination = root / 'builds' / archive.name.removesuffix('.tar.gz')
              unpack(archive, destination)
              builds.append(destination)
          collect(builds, root / 'sdk-release', complete=True)
          PY
          python3 -B release/release.py package "$RUNNER_TEMP/sdk-release"
          python3 -B release/release.py gate "$RUNNER_TEMP/sdk-release/packages" --source "$RUNNER_TEMP/sdk-release/source" --packages-only
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/sdk-release/packages/release-manifest.json
      - name: Create the immutable draft proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION_PATH" "$RUNNER_TEMP/sdk-release/packages/github-attestation.json"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/sdk-release/packages/"* \
            --draft --verify-tag --target "$GITHUB_SHA" --title "Stogas SDK $GITHUB_REF_NAME"
