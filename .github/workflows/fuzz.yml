name: Fuzz Campaign

# Runs nightly instead of gating releases. CI runs every input the campaigns kept
# on each push, and each crash found here also becomes a regression test.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  # The fuzz jobs read the corpora that earlier campaigns kept.
  actions: read
  contents: read

env:
  # Cargo and rustup retry a failed download three times by default. Cargo's
  # take about 10 seconds, which a hosted runner's DNS failure can outlast; ten
  # take about 80.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 |
            jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    concurrency:
      group: verifier-fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup install --no-self-update --profile minimal "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Restore the corpus an earlier campaign kept
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz-corpus.sh "fuzz/corpus/$TARGET" "$TARGET"
      - run: cargo install cargo-fuzz --version =0.13.2 --locked
      # One libFuzzer process per core (-fork). Fork mode ignores timeouts and
      # running out of memory unless told otherwise; both stay failures.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" --jobs "$(nproc)" -- -max_total_time=1800 -timeout=15 -ignore_timeouts=0 -ignore_ooms=0
      # Merging keeps one input for each behavior the campaign reached, so the corpus
      # does not grow with each night. A failed campaign keeps its corpus whole.
      - name: Minimize the corpus
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz cmin "$TARGET"
      - name: Keep the corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
