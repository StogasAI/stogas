name: Fuzz Campaign

# Runs nightly instead of gating releases; each crash it finds becomes a
# regression test, which then gates releases through CI.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 |
            jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    concurrency:
      group: verifier-fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: rustup install --no-self-update --profile minimal "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
      - name: Restore generated fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}-
            verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-
      - run: cargo install cargo-fuzz --version =0.13.2 --locked
      - run: cargo fuzz run "${{ matrix.target }}" -- -max_total_time=1800 -timeout=15
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
