name: Fuzz Campaign

# Runs nightly instead of gating releases. CI runs every input the campaigns kept
# on each push, and each crash found here also becomes a regression test.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  # The fuzz jobs read the corpora that earlier campaigns kept.
  actions: read
  contents: read

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1 |
            jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    concurrency:
      group: verifier-fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: rustup install --no-self-update --profile minimal "$RUSTUP_TOOLCHAIN"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
      - name: Restore the corpus an earlier campaign kept
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz-corpus.sh "fuzz/corpus/$TARGET" "$TARGET"
      - run: cargo install cargo-fuzz --version =0.13.2 --locked
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$TARGET" -- -max_total_time=1800 -timeout=15
      # Merging keeps one input for each behavior the campaign reached, so the corpus
      # does not grow with each night. A failed campaign keeps its corpus whole.
      - name: Minimize the corpus
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz cmin "$TARGET"
      - name: Keep the corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
