name: Publish approved SDK bytes

# Stogas publishes a release only after it has checked every file. Resume with
# `gh workflow run publish.yml --ref <tag>`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A publication uploads only the approved release files, never a cache that another run wrote.
cache-mode: none

concurrency:
  group: sdk-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the package registries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
          mkdir "$RUNNER_TEMP/approved"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/approved"
      # Stogas signs a release only after rebuilding it, so a draft made public without
      # that check publishes nothing. The CLI comes from the tagged source, not the release.
      - name: Require the Stogas signature on every file
        run: |
          cargo build --locked --package stogas-cli
          target/debug/stogas verify-release "$RUNNER_TEMP/approved"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates
      - name: Publish the exact crate archives in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: python3 -B release/publish.py crates "$RUNNER_TEMP/approved"
      - name: Publish the exact npm archives with trusted publishing and provenance
        run: python3 -B release/publish.py npm "$RUNNER_TEMP/approved"
      - name: Stage approved wheels
        run: |
          mkdir "$RUNNER_TEMP/wheels"
          cp "$RUNNER_TEMP/approved/"*.whl "$RUNNER_TEMP/wheels/"
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: ${{ runner.temp }}/wheels
          skip-existing: true
      - name: Verify all PyPI wheel bytes
        run: python3 -B release/publish.py pypi "$RUNNER_TEMP/approved"
      - name: Install the pinned Maven Central publisher
        run: |
          curl --fail --location --silent --show-error https://github.com/jreleaser/jreleaser/releases/download/v1.26.0/jreleaser-1.26.0.zip --output "$RUNNER_TEMP/jreleaser.zip"
          printf '%s  %s\n' c821df22b1715a841024ba17c4b5233375c868e6c9dcc81612c38329c8dec628 "$RUNNER_TEMP/jreleaser.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jreleaser.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/jreleaser-1.26.0/bin" >> "$GITHUB_PATH"
      - name: Publish the exact Java and Android packages
        env:
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 -B release/publish.py maven "$RUNNER_TEMP/approved"
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish and verify NuGet package contents and repository signature
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 -B release/publish.py nuget "$RUNNER_TEMP/approved"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Publish the exact platform gems
        run: python3 -B release/publish.py ruby "$RUNNER_TEMP/approved"
      - name: Publish the approved Go module as a module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py go "$RUNNER_TEMP/approved"
