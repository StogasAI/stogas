name: Publish approved SDK bytes

# Stogas publishes a release only after it has checked every file. Resume with
# `gh workflow run publish.yml --ref <tag>`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A publication uploads only the approved release files, never a cache that another run wrote.
cache-mode: none

env:
  # Cargo and rustup retry a failed download three times by default. Cargo's
  # take about 10 seconds, which a hosted runner's DNS failure can outlast; ten
  # take about 80.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

concurrency:
  group: sdk-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the package registries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
          mkdir "$RUNNER_TEMP/approved"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/approved"
      # Stogas signs a release only after rebuilding it, so a draft made public without
      # that check publishes nothing. The CLI comes from the tagged source, not the release.
      # Stogas does not sign a preview, made before production serves evidence: its gate
      # and GitHub's build proof stand alone, and only a pre-release can be one.
      - name: Require the Stogas signature on every file, or a preview's build proof
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -e "$RUNNER_TEMP/approved/stogas-signature.json" ]; then
            cargo build --locked --package stogas-cli
            target/debug/stogas verify-release "$RUNNER_TEMP/approved"
          else
            python3 -B release/publish.py preview "$RUNNER_TEMP/approved"
          fi
      # The registries that need no first-release step from the owner go first, so one
      # that still waits for it holds up nothing else.
      - name: Stage approved wheels
        run: |
          mkdir "$RUNNER_TEMP/wheels"
          cp "$RUNNER_TEMP/approved/"*.whl "$RUNNER_TEMP/wheels/"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: ${{ runner.temp }}/wheels
          skip-existing: true
      - name: Verify all PyPI wheel bytes
        run: python3 -B release/publish.py pypi "$RUNNER_TEMP/approved"
      - name: Install the pinned Maven Central publisher
        run: |
          curl --fail --location --silent --show-error https://github.com/jreleaser/jreleaser/releases/download/v1.26.0/jreleaser-1.26.0.zip --output "$RUNNER_TEMP/jreleaser.zip"
          printf '%s  %s\n' c821df22b1715a841024ba17c4b5233375c868e6c9dcc81612c38329c8dec628 "$RUNNER_TEMP/jreleaser.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jreleaser.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/jreleaser-1.26.0/bin" >> "$GITHUB_PATH"
      - name: Publish the exact Java and Android packages
        env:
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 -B release/publish.py maven "$RUNNER_TEMP/approved"
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish and verify NuGet package contents and repository signature
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 -B release/publish.py nuget "$RUNNER_TEMP/approved"
      - name: Publish the approved Go module as a module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py go "$RUNNER_TEMP/approved"
      # crates.io and npm trust this workflow only for packages that exist, and RubyGems
      # only once the owner added a pending publisher, so their first versions wait for
      # the owner's one-time steps; run this workflow again afterwards.
      - name: Find the registries that still wait for a first version
        id: first
        run: python3 -B release/publish.py first-versions >> "$GITHUB_OUTPUT"
      - if: steps.first.outputs.crates == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates
      - if: steps.first.outputs.crates == 'false'
        name: Publish the exact crate archives in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: python3 -B release/publish.py crates "$RUNNER_TEMP/approved"
      - if: steps.first.outputs.npm == 'false'
        name: Publish the exact npm archives with trusted publishing and provenance
        run: python3 -B release/publish.py npm "$RUNNER_TEMP/approved"
      # A pending publisher for a new gem lasts only 12 hours, so a missing one skips RubyGems.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
        id: rubygems
        continue-on-error: ${{ steps.first.outputs.ruby == 'true' }}
      - if: steps.rubygems.outcome == 'success'
        name: Publish the exact platform gems
        run: python3 -B release/publish.py ruby "$RUNNER_TEMP/approved"
      # Package managers that install the release's own archives follow the newest full release,
      # or the newest preview before the first. They run even when a registry above failed, but
      # never on files that failed the check.
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Offer the CLI through Homebrew and Scoop
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: python3 -B release/publish.py tap "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Offer the CLI through the Arch User Repository
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: python3 -B release/publish.py aur "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Publish the CLI container image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py container "$RUNNER_TEMP/approved"
      # The build proof goes to the registry with the image, through Docker's login.
      - if: ${{ !cancelled() && steps.image.outputs.digest != '' }}
        name: Sign in to the container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      # `gh attestation verify oci://ghcr.io/stogasai/stogas:<version> --repo StogasAI/stogas`
      # checks the image, which holds the release's own CLI bytes.
      - if: ${{ !cancelled() && steps.image.outputs.digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/stogasai/stogas
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - if: steps.first.outputs.crates == 'true' || steps.first.outputs.npm == 'true' || steps.rubygems.outcome != 'success'
        name: Name the registries that wait for the owner's one-time steps
        env:
          CRATES: ${{ steps.first.outputs.crates }}
          NPM: ${{ steps.first.outputs.npm }}
          RUBYGEMS: ${{ steps.rubygems.outcome }}
        run: |
          waiting=()
          if [ "$CRATES" = true ]; then waiting+=(crates.io); fi
          if [ "$NPM" = true ]; then waiting+=(npm); fi
          if [ "$RUBYGEMS" != success ]; then waiting+=(RubyGems); fi
          echo "::warning::${waiting[*]} still wait for the owner's one-time steps; run this workflow again afterwards"
