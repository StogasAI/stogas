name: Publish approved SDK bytes

# Stogas publishes a release only after it has checked every file. Resume with
# `gh workflow run publish.yml --ref <tag>`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A publication uploads only the approved release files, never a cache that another run wrote.
cache-mode: none

env:
  # Cargo and rustup retry a failed download three times by default. Cargo's
  # take about 10 seconds, which a hosted runner's DNS failure can outlast; ten
  # take about 80.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

# Runs wait in turn rather than replacing a pending one, so no release's publication is dropped.
# One at a time, since Homebrew, Scoop, the AUR and npm's latest follow the newest release.
concurrency:
  group: sdk-registry-publication
  cancel-in-progress: false
  queue: max

jobs:
  # Building the CLI runs its dependencies' build scripts, so it happens here, with no
  # credential that a registry trusts.
  verify:
    name: Check the published release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
          mkdir "$RUNNER_TEMP/approved"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/approved"
      - name: Install the pinned cosign
        run: |
          mkdir "$RUNNER_TEMP/cosign"
          release/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      # Stogas signs a release only after GitLab's rebuild matches GitHub's build, so a draft
      # made public without that check publishes nothing. The CLI comes from the tagged source,
      # not the release.
      # Stogas does not sign a preview: its gate and GitHub's build proof stand alone, with
      # GitLab's proof when the preview was rebuilt, and only a pre-release can be one.
      - name: Require the Stogas signature on every file, or a preview's build proofs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -e "$RUNNER_TEMP/approved/stogas-signature.json" ]; then
            cargo build --locked --package stogas-cli
            target/debug/stogas verify-release "$RUNNER_TEMP/approved"
          else
            python3 -B release/publish.py preview "$RUNNER_TEMP/approved"
          fi
          echo "digest=$(cd "$RUNNER_TEMP/approved" && LC_ALL=C sha256sum -- * | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to the package registries
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The environment guards the publishing credentials. The job deploys nothing, so it records
    # no deployment, which would only fill the repository's Deployments list.
    environment:
      name: release
      deployment: false
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      # The release again from GitHub, which the check job's code cannot change, with the
      # same files.
      - name: Download the checked release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ needs.verify.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
          mkdir "$RUNNER_TEMP/approved"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/approved"
          test "$(cd "$RUNNER_TEMP/approved" && LC_ALL=C sha256sum -- * | sha256sum | cut -d ' ' -f 1)" = "$CHECKED"
      # Each registry publishes once the release passed its check, even when another failed,
      # so a failed or waiting registry holds up no other; the job still fails, and the next
      # run skips what is already published. Those that never wait for a first version go
      # first.
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Stage approved wheels
        run: |
          mkdir "$RUNNER_TEMP/wheels"
          cp "$RUNNER_TEMP/approved/"*.whl "$RUNNER_TEMP/wheels/"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/wheels
          skip-existing: true
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Verify all PyPI wheel bytes
        run: python3 -B release/publish.py pypi "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Install the pinned Maven Central publisher and Sigstore signer
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors https://github.com/jreleaser/jreleaser/releases/download/v1.26.0/jreleaser-1.26.0.zip --output "$RUNNER_TEMP/jreleaser.zip"
          printf '%s  %s\n' c821df22b1715a841024ba17c4b5233375c868e6c9dcc81612c38329c8dec628 "$RUNNER_TEMP/jreleaser.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jreleaser.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/jreleaser-1.26.0/bin" >> "$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/cosign"
          release/install-cosign.sh "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP/cosign" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Publish the exact Java and Android packages
        env:
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 -B release/publish.py maven "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Publish and verify NuGet package contents and repository signature
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 -B release/publish.py nuget "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Publish the approved Go module as a module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py go "$RUNNER_TEMP/approved"
      # crates.io and npm trust this workflow only for packages that exist, and RubyGems only
      # once a pending publisher names the gem, so `publish.py owner` publishes a new package's
      # first version from its owner's terminal, and its registry waits until then.
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Find the registries that still wait for a first version
        id: first
        run: python3 -B release/publish.py first-versions >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.first.outputs.crates == 'false' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates
      - if: ${{ !cancelled() && steps.crates.outcome == 'success' }}
        name: Publish the exact crate archives in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: python3 -B release/publish.py crates "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.first.outputs.npm == 'false' }}
        name: Publish the exact npm archives with trusted publishing and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py npm "$RUNNER_TEMP/approved"
      # RubyGems.org accepts a gem's build proof only from its trusted publisher's workflow, so
      # this job makes one, before the RubyGems key reaches the environment.
      - if: ${{ !cancelled() && steps.first.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: gem-proof
        with:
          subject-path: ${{ runner.temp }}/approved/*.gem
          create-storage-record: false
      # A pending publisher for a new gem lasts only 12 hours, so a missing one skips RubyGems.
      - if: ${{ !cancelled() && steps.first.outcome == 'success' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        id: rubygems
        continue-on-error: ${{ steps.first.outputs.ruby == 'true' }}
      - if: ${{ !cancelled() && steps.rubygems.outcome == 'success' && steps.gem-proof.outcome == 'success' }}
        name: Publish the exact platform gems with their build proof
        env:
          GEM_PROOF: ${{ steps.gem-proof.outputs.bundle-path }}
        run: python3 -B release/publish.py ruby "$RUNNER_TEMP/approved" --attestation "$GEM_PROOF"
      # The RubyGems action leaves its key in every later step's environment.
      - if: ${{ !cancelled() && steps.rubygems.outcome == 'success' }}
        name: Keep the RubyGems key from later steps
        run: printf '%s=\n' RUBYGEMS_API_KEY BUNDLE_GEM__PUSH_KEY GEM_HOST_API_KEY >> "$GITHUB_ENV"
      # Package managers that install the release's own archives follow the newest full release,
      # or the newest preview before the first. They run even when a registry above failed, but
      # never on files that failed the check.
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Offer the CLI through Homebrew and Scoop
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: python3 -B release/publish.py tap "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Offer the CLI through the Arch User Repository
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: python3 -B release/publish.py aur "$RUNNER_TEMP/approved"
      - if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        name: Publish the CLI container image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish.py container "$RUNNER_TEMP/approved"
      # The build proof goes to the registry with the image, through Docker's login.
      - if: ${{ !cancelled() && steps.image.outputs.digest != '' }}
        name: Sign in to the container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      # release.yml's build proof already names the image's digest. This one records the push and
      # goes to the registry with the image, where admission controllers and registry tools that
      # do not ask GitHub find it.
      - if: ${{ !cancelled() && steps.image.outputs.digest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/stogasai/stogas
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # GitHub's artifact inventory would need artifact-metadata: write; the proof needs none.
          create-storage-record: false
      - if: ${{ !cancelled() && steps.first.outcome == 'success' && (steps.first.outputs.crates == 'true' || steps.first.outputs.npm == 'true' || steps.rubygems.outcome != 'success') }}
        name: Name the registries that wait for a first version
        env:
          CRATES: ${{ steps.first.outputs.crates }}
          NPM: ${{ steps.first.outputs.npm }}
          RUBYGEMS: ${{ steps.rubygems.outcome }}
        run: |
          waiting=()
          if [ "$CRATES" = true ]; then waiting+=(crates.io); fi
          if [ "$NPM" = true ]; then waiting+=(npm); fi
          if [ "$RUBYGEMS" != success ]; then waiting+=(RubyGems); fi
          echo "::warning::${waiting[*]} still wait for a new package's first version from publish.py owner; run this workflow again afterwards"

  # Users install the CLI from these channels, so publication ends by doing the same.
  installs:
    name: Install the CLI from its channels
    needs: publish
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    permissions:
      attestations: read
      contents: read
    uses: $/.github/workflows/installs.yml
    with:
      tag: ${{ github.ref_name }}
