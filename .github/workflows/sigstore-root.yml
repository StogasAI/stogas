name: Sigstore Trusted Root

# The verifier never downloads Sigstore keys. Evidence carries Sigstore's current
# keys; this daily check keeps the compiled copy, which verifies releases and
# build proofs without evidence, current while the old keys still verify them.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: scripts/check-sigstore-root.sh
