name: ARM Rebuild

# A rebuild on an ARM machine, such as a recent Mac, runs the pinned x86-64 build images under
# emulation. This job does the same on GitHub's ARM runner for every published release: it builds
# the portable packages, whose files the release lists by name, and requires the released bytes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true

permissions: {}

jobs:
  portable:
    name: Rebuild the portable packages on ARM
    runs-on: ubuntu-24.04-arm
    # Emulation makes the build several times slower.
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Require a release tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - name: Let Docker run x86-64 images through QEMU
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install amd64
      - name: Build the portable packages under emulation
        run: python3 -B release/release.py build --platform portable --out "$RUNNER_TEMP/build"
      - name: Require the bytes that the release lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP/release"
          python3 -B - "$RUNNER_TEMP/release/release-manifest.json" "$RUNNER_TEMP/build/portable/portable.json" <<'PY'
          import json, sys
          released = {artifact["name"]: artifact for artifact in json.load(open(sys.argv[1]))["artifacts"]}
          built = json.load(open(sys.argv[2]))["artifacts"]
          differ = [artifact["name"] for artifact in built if released.get(artifact["name"], {}).get("sha256") != artifact["sha256"]]
          if not built or differ:
              raise SystemExit("ARM's build differs from the release: " + (", ".join(differ) or "no files"))
          print(f"ARM's build made the released bytes of {len(built)} files.")
          PY
