[package]
name = "stogas-cli"
description = "The Stogas command line: sign-up, top-ups, policy editing, credential checks, a verified local endpoint, offline verification and local encryption"
readme = "../../README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://stogas.ai/docs/cli"
keywords = ["confidential-computing", "sev-snp", "openai", "e2ee", "cli"]
categories = ["command-line-utilities", "authentication", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "stogas"
path = "src/main.rs"

[features]
staging = ["stogas/staging"]

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { version = "4.5.47", features = ["derive", "env"] }
futures-util = "0.3.31"
gethostname = "1.1.0"
getrandom.workspace = true
hex.workspace = true
http = "1.5.0"
keyring-core = "1.0.1"
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7.5.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stogas = { path = "../sdk", version = "0.1.0-alpha.1" }
stogas-core = { path = "../core", version = "0.1.0-alpha.1" }
stogas-sigstore = { path = "../sigstore", version = "0.1.0-alpha.1" }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url.workspace = true
zeroize.workspace = true

# The system keychain on each platform that ships the CLI.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

# cargo-binstall installs the release archive's CLI for the host, the bytes that the release's build
# proof covers, and builds from source where no archive fits. It never takes a build from
# cargo-quickinstall, which Stogas did not make.
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-linux-amd64.tar.gz"
bin-dir = "stogas-v{ version }-linux-amd64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-linux-arm64.tar.gz"
bin-dir = "stogas-v{ version }-linux-arm64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-linux-musl-amd64.tar.gz"
bin-dir = "stogas-v{ version }-linux-musl-amd64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-linux-musl-arm64.tar.gz"
bin-dir = "stogas-v{ version }-linux-musl-arm64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-darwin-amd64.tar.gz"
bin-dir = "stogas-v{ version }-darwin-amd64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-darwin-arm64.tar.gz"
bin-dir = "stogas-v{ version }-darwin-arm64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-windows-amd64.zip"
bin-dir = "stogas-v{ version }-windows-amd64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "https://github.com/StogasAI/stogas/releases/download/v{ version }/stogas-v{ version }-windows-arm64.zip"
bin-dir = "stogas-v{ version }-windows-arm64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lints]
workspace = true
