[package]
name = "stogas-cli"
description = "The Stogas command line: sign-up, top-ups, a verified local endpoint, offline verification and local encryption"
readme = "../../README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://stogas.ai/docs/cli"
keywords = ["confidential-computing", "sev-snp", "openai", "e2ee", "cli"]
categories = ["command-line-utilities", "authentication", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "stogas"
path = "src/main.rs"

[features]
staging = ["stogas/staging"]

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
clap = { version = "4.5.47", features = ["derive"] }
gethostname = "1.1.0"
getrandom.workspace = true
hex.workspace = true
keyring-core = "1.0.1"
qrcode = { version = "0.14.1", default-features = false }
reqwest.workspace = true
rpassword = "7.5.4"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stogas = { path = "../sdk", version = "0.1.0-alpha.1" }
stogas-core = { path = "../core", version = "0.1.0-alpha.1" }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "time"] }
url.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

# The system keychain on each platform that ships the CLI.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[lints]
workspace = true
