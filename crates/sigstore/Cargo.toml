[package]
name = "stogas-sigstore"
description = "Networkless verification of the GitHub/Sigstore in-toto profile"
readme = "README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://docs.rs/stogas-sigstore"
keywords = ["sigstore", "in-toto", "slsa", "verification", "wasm"]
categories = ["authentication", "cryptography", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
# The first cms release on der 0.8 is still a release candidate.
cms = { version = "0.3.0-rc.2", default-features = false }
const-oid = { version = "0.10.3", features = ["db"] }
der = { version = "0.8.3", features = ["derive"] }
ed25519-dalek = { workspace = true, features = ["digest"] }
hex.workspace = true
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
pem = "3.0.5"
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }
rustls-pki-types = { version = "1.15.0", default-features = false, features = ["alloc"] }
rustls-webpki = { version = "0.103.13", default-features = false, features = ["alloc", "std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
signature = "3.0.0"
spki = "0.8.1"
thiserror.workspace = true
tls_codec = { version = "0.4.2", default-features = false, features = ["derive"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["sct"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sigstore-trust-root = { version = "=0.11.0", default-features = false }
sigstore-types = "=0.11.0"
sigstore-verify = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

[package.metadata.cargo-machete]
# The rustls-webpki package exposes its Rust library under the webpki crate name.
ignored = ["rustls-webpki"]
