[package]
name = "stogas-core"
description = "Offline verifier for Stogas confidential gateway evidence"
readme = "README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://docs.rs/stogas-core"
keywords = ["attestation", "sev-snp", "sigstore", "verification"]
categories = ["authentication", "cryptography", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
staging = []
# Gateway-side producers; only the gateway's native build enables them.
gateway = []

[dependencies]
# These existing transitive dependencies do not inherit aes-gcm/hpke erasure features.
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64.workspace = true
chrono.workspace = true
const-oid = { version = "0.10.3", features = ["db"] }
der = { version = "0.8.3", features = ["derive", "oid"] }
ed25519-dalek = { workspace = true, features = ["digest"] }
getrandom.workspace = true
ghash = { version = "0.6.0", default-features = false, features = ["zeroize"] }
hex.workspace = true
hkdf = "0.13.0"
# Enable erasure for HKDF's HMAC state through Cargo feature unification.
hmac = { version = "0.13.0", features = ["zeroize"] }
# hpke requires one built-in KEM feature; kem.rs supplies X-Wing and setup uses libcrux X25519.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "aes", "x25519"] }
hybrid-array = { version = "0.4.15", features = ["extra-sizes"] }
libcrux-curve25519 = "0.0.9"
libcrux-kem = { version = "0.0.10", default-features = false }
libcrux-ml-dsa = { version = "0.0.11", default-features = false, features = ["mldsa65"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-sha3 = { version = "0.0.11", default-features = false }
libcrux-traits = { version = "0.0.9", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
pkcs8 = { version = "0.11.0", features = ["alloc"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
sha2 = { workspace = true, features = ["zeroize"] }
spki = "0.8.1"
stogas-sev-snp = { workspace = true, features = ["serde"] }
stogas-sigstore.workspace = true
subtle = { version = "2.6.1", default-features = false }
thiserror.workspace = true
x509-cert = { version = "0.3.0", default-features = false }
zeroize.workspace = true

[dev-dependencies]
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
stogas-alloc-probe = { path = "../alloc-probe" }
x-wing = { version = "=0.1.1", default-features = false, features = ["zeroize"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-test = "=0.3.79"

[package.metadata.cargo-machete]
ignored = ["aes", "ghash"]

[lints]
workspace = true
