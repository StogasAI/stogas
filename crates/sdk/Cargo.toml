[package]
name = "stogas"
description = "The Stogas SDK for verified confidential AI connections"
readme = "../../README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://docs.rs/stogas"
keywords = ["confidential-computing", "sev-snp", "openai", "e2ee"]
categories = ["api-bindings", "authentication", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "stogas"
path = "src/lib.rs"

[features]
staging = ["stogas-verifier/staging"]

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
axum = "0.8.4"
base64.workspace = true
futures-util = "0.3.31"
getrandom.workspace = true
h2 = "0.4.15"
hex.workspace = true
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["brotli", "gzip", "http2", "json", "rustls-tls-webpki-roots-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
stogas-verifier = { path = "../verifier", version = "0.1.0-alpha.1" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.4"
url.workspace = true
webpki-roots = "1.0.2"

[dev-dependencies]
brotli = "8"
flate2 = "1"
rcgen = "0.14.4"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
