[package]
name = "stogas-verifier-ffi"
description = "Bounded C ABI for stogas-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["transport"]
transport = ["dep:stogas-sdk"]
# The gateway's embedding: channel server, boot keys, quote batches and its
# own registration check.
gateway = ["stogas-verifier/gateway", "dep:zeroize"]
staging = ["stogas-verifier/staging", "stogas-sdk?/staging"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
stogas-sdk = { package = "stogas", path = "../sdk", optional = true }
stogas-verifier = { path = "../verifier" }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
hex.workspace = true
sha2.workspace = true

[lints.rust]
missing_docs = "allow"
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
