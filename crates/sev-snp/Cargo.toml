[package]
name = "stogas-sev-snp"
description = "Networkless verification of AMD SEV-SNP attestation reports, for no_std, native and WebAssembly"
readme = "README.md"
homepage = "https://github.com/StogasAI/stogas"
documentation = "https://docs.rs/stogas-sev-snp"
keywords = ["sev-snp", "amd", "attestation", "confidential", "no-std"]
categories = ["authentication", "cryptography", "no-std", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# JSON forms of policies, reports and results, for bindings and stored policies.
serde = ["dep:serde"]

[dependencies]
# Declared here rather than inherited, so that a no_std build gets no std features.
const-oid = { version = "0.10.3", default-features = false, features = ["db"] }
der = { version = "0.8.3", default-features = false, features = ["alloc", "oid"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"], optional = true }
sha2 = { version = "0.11.1", default-features = false }
x509-cert = { version = "0.3.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true
stogas-sev-snp = { path = ".", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The most used Rust SEV-SNP crate, as a differential oracle for report parsing and signatures.
sev = { version = "=9.0.0", default-features = false, features = ["snp", "crypto_nossl"] }

[lints]
workspace = true
