[package]
name = "stogas-wasm"
description = "WebAssembly bindings for stogas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
staging = ["stogas-core/staging"]
# Stogas's own services and CLI; customer packages never enable it.
operator = []

[dependencies]
base64.workspace = true
js-sys = "0.3.106"
getrandom-02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
hex.workspace = true
serde-wasm-bindgen = "0.6.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stogas-sigstore = { path = "../sigstore" }
stogas-core = { path = "../core" }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["AesGcmParams", "CryptoKey", "SubtleCrypto"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "aes", "x25519", "mlkem"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# These direct dependencies select JavaScript entropy backends for transitive users.
ignored = ["getrandom-02", "getrandom-04"]
