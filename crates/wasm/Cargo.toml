[package]
name = "stogas-wasm"
description = "WebAssembly bindings for stogas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
staging = ["stogas-core/staging"]
# Stogas's own services and CLI; customer packages never enable it.
operator = []

[dependencies]
base64.workspace = true
js-sys = "0.3.106"
getrandom = { workspace = true, features = ["wasm_js"] }
hex.workspace = true
serde-wasm-bindgen = "0.6.5"
serde.workspace = true
serde_json.workspace = true
stogas-sigstore.workspace = true
stogas-core.workspace = true
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["AesGcmParams", "CryptoKey", "SubtleCrypto"] }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
sha2.workspace = true
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "aes", "x25519", "mlkem"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# This direct dependency selects the JavaScript entropy backend for stogas-core.
ignored = ["getrandom"]
